<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phiếu Đăng Ký Xét Tuyển - ĐH Cửu Long 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #f8f9fa;
        }
        .card {
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .section-title {
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            color: white;
            padding: 14px 20px;
            border-radius: 16px 16px 0 0;
            font-weight: 600;
        }
        .form-control, .form-select {
            border-radius: 10px;
            padding: 10px 14px;
        }
        .form-label {
            font-weight: 600;
            color: #1e40af;
        }
        .required { color: #ef4444; }
        .table th { background-color: #f1f5f9; font-weight: 600; }
        .score-input {
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="text-center mb-5">
            <h1 class="display-5 fw-bold text-primary mb-2">📋 PHIẾU ĐĂNG KÝ XÉT TUYỂN</h1>
            <h2 class="h4 text-muted">Đại học Cửu Long - Năm 2026</h2>
        </div>
        <div class="row justify-content-center">
            <div class="col-12 col-xl-10">

                <!-- THÔNG TIN HỌC SINH -->
                <div class="card mb-4">
                    <div class="section-title">
                        <i class="fas fa-user me-2"></i> THÔNG TIN HỌC SINH
                    </div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Họ và tên <span class="required">*</span></label>
                                <input type="text" id="hoTen" class="form-control" placeholder="Nhập họ và tên đầy đủ">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Giới tính <span class="required">*</span></label>
                                <select id="gioiTinh" class="form-select">
                                    <option value="">Chọn</option>
                                    <option value="Nam">Nam</option>
                                    <option value="Nữ">Nữ</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Ngày sinh <span class="required">*</span></label>
                                <input type="date" id="ngaySinh" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Nơi sinh <span class="required">*</span></label>
                                <select id="noiSinh" class="form-select"></select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Dân tộc <span class="required">*</span></label>
                                <select id="danToc" class="form-select"></select>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Số căn cước công dân (12 số) <span class="required">*</span></label>
                                <input type="text" id="cccd" class="form-control" maxlength="12" placeholder="Nhập đúng 12 số CCCD"
                                       oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                            </div>
                            <div class="col-md-8">
                                <label class="form-label">Hộ khẩu thường trú - Xã/Phường</label>
                                <input type="text" id="hoKhauXa" class="form-control">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Tỉnh/Thành phố</label>
                                <select id="hoKhauTinh" class="form-select"></select>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Địa chỉ nhận thư</label>
                                <input type="text" id="diaChiNha" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Học THPT/GDTX tại tỉnh</label>
                                <select id="tinhTruongTHPT" class="form-select"></select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Trường</label>
                                <input type="text" id="truongTHPT" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">SĐT 1 <span class="required">*</span></label>
                                <input type="tel" id="sdt1" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">SĐT 2</label>
                                <input type="tel" id="sdt2" class="form-control">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Học lực lớp 12</label>
                                <select id="hocLuc" class="form-select">
                                    <option value="">Chọn</option>
                                    <option value="Xuất sắc">Xuất sắc</option>
                                    <option value="Giỏi">Giỏi</option>
                                    <option value="Khá">Khá</option>
                                    <option value="Đạt">Đạt</option>
                                    <option value="Chưa Đạt">Chưa Đạt</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Hạnh kiểm lớp 12</label>
                                <select id="hanhKiem" class="form-select">
                                    <option value="">Chọn</option>
                                    <option value="Tốt">Tốt</option>
                                    <option value="Khá">Khá</option>
                                    <option value="Đạt">Đạt</option>
                                    <option value="Chưa Đạt">Chưa Đạt</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Năm tốt nghiệp</label>
                                <input type="text" id="namTotNghiep" value="2026" class="form-control">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- THÔNG TIN XÉT TUYỂN -->
                <div class="card mb-4">
                    <div class="section-title">
                        <i class="fas fa-graduation-cap me-2"></i> THÔNG TIN XÉT TUYỂN
                    </div>
                    <div class="card-body">
                        <div class="mb-4">
                            <label class="form-label">Chọn ngành học <span class="required">*</span></label>
                            <input type="text" id="majorSearch" class="form-control form-control-lg" placeholder="Tìm ngành...">
                            <div id="suggestions" class="list-group mt-2 shadow" style="max-height: 380px; overflow-y: auto; display: none;"></div>
                        </div>
                        <div id="comboSection" class="mb-4 d-none">
                            <label class="form-label">Chọn tổ hợp môn (THM) <span class="required">*</span></label>
                            <select id="comboSelect" class="form-select" onchange="showScoreTable()">
                                <option value="">Chọn tổ hợp môn...</option>
                            </select>
                        </div>
                        <div id="scoreSection" class="d-none">
                            <label class="form-label">Nhập điểm học bạ theo tổ hợp</label>
                            <div class="table-responsive">
                                <table class="table table-bordered align-middle" id="scoreTable">
                                    <thead class="table-light">
                                        <tr>
                                            <th width="50">STT</th>
                                            <th>Môn học</th>
                                            <th width="130">Lớp 10</th>
                                            <th width="130">Lớp 11</th>
                                            <th width="130">Lớp 12</th>
                                        </tr>
                                    </thead>
                                    <tbody id="scoreTableBody"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <button onclick="submitForm()" class="btn btn-success btn-lg px-5 py-3 me-3">
                        <i class="fas fa-file-pdf me-2"></i> HOÀN TẤT & XUẤT PDF
                    </button>
                    <button onclick="nhapLaiForm()" class="btn btn-warning btn-lg px-5 py-3">
                        <i class="fas fa-undo me-2"></i> NHẬP LẠI
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==================== DỮ LIỆU ====================
        const tinhList = ["An Giang","Bạc Liêu","Bến Tre","Cà Mau","Cần Thơ","Đồng Tháp","Hậu Giang","Kiên Giang","Long An","Sóc Trăng","Tiền Giang","Trà Vinh","Vĩnh Long","TP. Hồ Chí Minh","Khác"];
        const danTocList = ["Kinh","Hoa","Khmer","Chăm","Thái","Mường","Nùng","Tày","H'Mông","Dao","Khác"];
       
        const majors = [
            {name: "Y khoa", combos: ["A00","A01","A02","B00","B03","B08","C01","C08","D07"]},
            {name: "Dược học", combos: ["A00","A01","A02","B00","B03","B08","C01","C08","D07"]},
            {name: "Công nghệ thông tin", combos: ["A00","A01","C01","D01","D07","X02","X04","X06","X26"]},
            {name: "Marketing", combos: ["A00","A01","A03","C03","C04","D01","X02","X17","X21"]},
            {name: "Quản trị kinh doanh", combos: ["A00","A01","A03","C03","C04","D01","X02","X17","X21"]},
            {name: "Luật", combos: ["A00","A01","C00","C03","C07","D01","X02","X17","X21"]},
        ];
        const subjectMap = {
            "A00": ["Toán", "Vật Lý", "Hóa Học"],
            "A01": ["Toán", "Vật Lý", "Tiếng Anh"],
            "A02": ["Toán", "Vật Lý", "Sinh Học"],
            "A03": ["Toán", "Vật Lý", "Lịch Sử"],
            "B00": ["Toán", "Hóa Học", "Sinh Học"],
            "B03": ["Toán", "Văn", "Sinh Học"],
            "B08": ["Toán", "Sinh Học", "Tiếng Anh"],
            "C00": ["Văn", "Lịch Sử", "Địa Lý"],
            "C01": ["Toán", "Văn", "Vật Lý"],
            "C03": ["Toán", "Văn", "Lịch Sử"],
            "C04": ["Toán", "Văn", "Địa Lý"],
            "D01": ["Toán", "Văn", "Tiếng Anh"],
            "D07": ["Toán", "Hóa Học", "Tiếng Anh"],
        };
        let scoreMemory = {};

        // ==================== KHỞI TẠO ====================
        function initSelects() {
            document.querySelectorAll('#noiSinh, #hoKhauTinh, #tinhTruongTHPT').forEach(select => {
                select.innerHTML = '<option value="">Chọn tỉnh/thành phố</option>';
                tinhList.forEach(t => select.appendChild(new Option(t, t)));
            });
            danTocList.forEach(dt => document.getElementById('danToc').appendChild(new Option(dt, dt)));
        }

        // ==================== CHỌN NGÀNH & BẢNG ĐIỂM (giữ nguyên) ====================
        // ... (phần code chọn ngành và bảng điểm giữ nguyên như cũ, tôi rút gọn để tiết kiệm chỗ)

        const majorSearch = document.getElementById('majorSearch');
        const suggestions = document.getElementById('suggestions');
        let selectedIndex = -1;

        majorSearch.addEventListener('input', function() {
            const term = this.value.toLowerCase().trim();
            suggestions.innerHTML = '';
            suggestions.style.display = 'none';
            selectedIndex = -1;
            if (!term) return;
            const filtered = majors.filter(m => m.name.toLowerCase().includes(term));
            filtered.forEach((major) => {
                const div = document.createElement('div');
                div.className = "list-group-item list-group-item-action py-3";
                div.textContent = major.name;
                div.onclick = () => selectMajor(majors.indexOf(major));
                suggestions.appendChild(div);
            });
            if (filtered.length > 0) suggestions.style.display = 'block';
        });

        function selectMajor(index) {
            majorSearch.value = majors[index].name;
            suggestions.style.display = 'none';
            document.getElementById('comboSection').classList.remove('d-none');
            renderComboOptions(majors[index].combos);
            document.getElementById('scoreSection').classList.add('d-none');
        }

        function renderComboOptions(combos) {
            const select = document.getElementById('comboSelect');
            select.innerHTML = '<option value="">Chọn tổ hợp môn...</option>';
            combos.forEach(combo => select.appendChild(new Option(combo, combo)));
        }

        function showScoreTable() {
            const combo = document.getElementById('comboSelect').value;
            if (!combo) return;
            const subjects = subjectMap[combo] || [];
            const tbody = document.getElementById('scoreTableBody');
            tbody.innerHTML = '';
            subjects.forEach((mon, i) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="text-center fw-bold">${i+1}</td>
                    <td>${mon}</td>
                    <td><input type="text" class="form-control score-input" data-subject="${mon}" data-lop="10" maxlength="5" placeholder="0.0"></td>
                    <td><input type="text" class="form-control score-input" data-subject="${mon}" data-lop="11" maxlength="5" placeholder="0.0"></td>
                    <td><input type="text" class="form-control score-input" data-subject="${mon}" data-lop="12" maxlength="5" placeholder="0.0"></td>
                `;
                tbody.appendChild(tr);
            });
            document.getElementById('scoreSection').classList.remove('d-none');
            setupScoreInputs();
        }

        function setupScoreInputs() {
            document.querySelectorAll('#scoreTableBody input').forEach(input => {
                input.addEventListener('input', () => input.value = input.value.replace(/[^0-9.]/g, ''));
            });
        }

        // ==================== SUBMIT FORM (ĐÃ ĐỒNG BỘ VỚI TEMPLATE) ====================
        async function submitForm() {
            const data = {
                ho_ten: document.getElementById('hoTen').value.trim(),
                gioi_tinh: document.getElementById('gioiTinh').value,
                ngay_sinh: document.getElementById('ngaySinh').value,
                noi_sinh: document.getElementById('noiSinh').value,
                dan_toc: document.getElementById('danToc').value,
                cccd: document.getElementById('cccd').value,
                ho_khau: document.getElementById('hoKhauXa').value,
                tinh_hokhau: document.getElementById('hoKhauTinh').value,
                dia_chi: document.getElementById('diaChiNha').value,
                sdt1: document.getElementById('sdt1').value,
                sdt2: document.getElementById('sdt2').value,
                tinh_thpt: document.getElementById('tinhTruongTHPT').value,
                truong_thpt: document.getElementById('truongTHPT').value,
                hoc_luc: document.getElementById('hocLuc').value,
                hanh_kiem: document.getElementById('hanhKiem').value,
                nam_tot_nghiep: document.getElementById('namTotNghiep').value,
                nganh1: document.getElementById('majorSearch').value,
                thm1: document.getElementById('comboSelect').value,
                nganh2: "", thm2: "",
                nganh3: "", thm3: "",
                nganh4: "", thm4: "",
                mon1: "", d_mon1_10: "", d_mon1_11: "", d_mon1_12: "",
                mon2: "", d_mon2_10: "", d_mon2_11: "", d_mon2_12: "",
                mon3: "", d_mon3_10: "", d_mon3_11: "", d_mon3_12: ""
            };

            // Lấy điểm từ bảng
            const rows = document.querySelectorAll('#scoreTableBody tr');
            rows.forEach((row, index) => {
                const mon = row.cells[1].textContent.trim();
                const d10 = row.cells[2].querySelector('input').value || "";
                const d11 = row.cells[3].querySelector('input').value || "";
                const d12 = row.cells[4].querySelector('input').value || "";
                if (index === 0) {
                    data.mon1 = mon; data.d_mon1_10 = d10; data.d_mon1_11 = d11; data.d_mon1_12 = d12;
                } else if (index === 1) {
                    data.mon2 = mon; data.d_mon2_10 = d10; data.d_mon2_11 = d11; data.d_mon2_12 = d12;
                } else if (index === 2) {
                    data.mon3 = mon; data.d_mon3_10 = d10; data.d_mon3_11 = d11; data.d_mon3_12 = d12;
                }
            });

            if (!data.ho_ten || !data.cccd || data.cccd.length !== 12 || !data.nganh1) {
                alert("Vui lòng nhập đầy đủ thông tin bắt buộc:\n• Họ và tên\n• CCCD (12 số)\n• Ngành học");
                return;
            }

            if (confirm("Xác nhận tạo phiếu và xuất PDF?")) {
                const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzxFD1bXe-T6hkkkcP9ip567lhe-RkJYsifHhvQSViWC1pkrfDd5D6NKHGUQ-cMXQv6/exec";
                
                try {
                    const response = await fetch(APPS_SCRIPT_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(data)
                    });
                    const result = await response.json();
                   
                    if (result.success && result.pdfUrl) {
                        alert("✅ Tạo PDF thành công!");
                        window.open(result.pdfUrl, "_blank");
                    } else {
                        alert("Lỗi: " + (result.error || "Không xác định"));
                    }
                } catch (err) {
                    alert("Lỗi kết nối. Vui lòng thử lại sau.");
                    console.error(err);
                }
            }
        }

        function nhapLaiForm() {
            if (confirm("Nhập lại toàn bộ phiếu?")) location.reload();
        }

        window.onload = initSelects;
    </script>
</body>
</html>
